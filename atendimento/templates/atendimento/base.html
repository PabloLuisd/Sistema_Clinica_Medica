{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Clínica Médica{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'atendimento/style.css' %}">
</head>

<body>

    <header>
        <h2>Clínica Médica</h2>

        <nav>
            <a href="{% url 'inicio' %}">Início</a>
            <a href="{% url 'listar_pacientes' %}">Pacientes</a>
            <a href="{% url 'listar_medicos' %}">Médicos</a>
            <a href="{% url 'listar_especialidades' %}">Especialidades</a>
            <a href="{% url 'listar_consultas' %}">Consultas</a>
        </nav>
    </header>

    <main>

        {% if messages %}
            {% for message in messages %}
                <p class="mensagem">{{ message }}</p>
            {% endfor %}
        {% endif %}

        {% block conteudo %}
        {% endblock %}

    </main>

</body>
</html>
